<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Diorama Stage Render</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    canvas { width: 100vw; height: 100vh; object-fit: contain; display: block; }
  </style>
</head>
<body>
  <canvas id="gl-canvas" width="1280" height="960"></canvas>
  <script type="module">
    import { createStudioRenderer } from './core/renderer.js';
    import { normalizeStage } from './core/validator.js';
    import { presetById } from './presets/index.js';

    const params = new URLSearchParams(location.search);
    const id = params.get('stage') || 'sunset_harbor_pier';
    const time = Number(params.get('t') ?? 1.8);
    const stage = normalizeStage(presetById(id));
    const canvas = document.getElementById('gl-canvas');
    const [aw, ah] = stage.meta.aspect || [4, 3];
    canvas.width = 1280;
    canvas.height = Math.round((1280 * ah) / aw);
    const renderer = createStudioRenderer(canvas);
    renderer.updateAtlas(stage.atlas?.normalStrength ?? 2.2);
    renderer.uploadStageGeometry(stage);
    renderer.render(stage, { time, beats: time * 2, beatSync: true, swayEnabled: false });
    window.__RENDER_INFO__ = { id: stage.meta.id, width: canvas.width, height: canvas.height };
    window.__RENDER_READY__ = true;
    document.title = 'RENDERED:' + stage.meta.id;
  </script>
</body>
</html>
